<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TalkMe</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="auth-screen" class="screen">
    <div class="auth-box">
      <h1>TalkMe</h1>
      <p class="subtitle">Chat sencillo en tiempo real</p>
      <form id="auth-form">
        <input id="username" type="text" placeholder="Usuario" autocomplete="username" required />
        <input id="email" type="email" placeholder="Email" autocomplete="email" required />
        <input id="password" type="password" placeholder="Contraseña" autocomplete="current-password" required />
        <input id="invite-code" type="text" placeholder="Código de invitación (solo para crear cuenta)" autocomplete="off" />
        <button type="submit" id="login-btn">Entrar</button>
        <button type="button" id="register-btn">Crear cuenta</button>
      </form>
      <p id="auth-error" class="error"></p>
    </div>
  </div>

  <div id="app-screen" class="screen hidden">
    <aside class="sidebar">
      <div class="sidebar-header">
        <span id="me"></span>
        <div>
          <button id="notif-btn" title="Activar notificaciones">🔔</button>
          <button id="logout-btn" title="Cerrar sesión">⏻</button>
        </div>
      </div>
      <form id="add-contact-form">
        <input id="add-contact-input" type="text" placeholder="Añadir a tu red (usuario)" required />
        <button type="submit">+</button>
      </form>
      <p id="contact-error" class="error"></p>

      <div id="requests-section" class="requests-section hidden">
        <h3>Solicitudes recibidas</h3>
        <ul id="incoming-requests"></ul>
      </div>
      <div id="outgoing-section" class="requests-section hidden">
        <h3>Solicitudes enviadas</h3>
        <ul id="outgoing-requests"></ul>
      </div>

      <h3 class="section-title">Tu red</h3>
      <ul id="contact-list"></ul>
    </aside>

    <main class="chat">
      <div id="chat-empty" class="chat-empty">Selecciona un contacto de tu red para chatear</div>
      <div id="chat-active" class="chat-active hidden">
        <div class="chat-header">
          <span id="chat-with"></span>
          <span id="chat-status" class="status"></span>
        </div>
        <div id="messages" class="messages"></div>
        <form id="message-form">
          <input id="message-input" type="text" placeholder="Escribe un mensaje..." autocomplete="off" required />
          <button type="submit">Enviar</button>
        </form>
      </div>
    </main>
  </div>

  <script src="config.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script src="app.js"></script>
</body>
</html>
